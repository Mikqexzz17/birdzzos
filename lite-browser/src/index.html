<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Browser</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e0e0e0; }

        /* TABS AREA */
        #tabs-bar {
            display: flex;
            background: #d4d4d4;
            padding: 4px 4px 0 4px;
            overflow-x: auto;
            border-bottom: 1px solid #999;
        }
        .tab {
            padding: 4px 10px;
            background: #e9e9e9;
            border: 1px solid #aaa;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            margin-right: 2px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            min-width: 80px;
            max-width: 150px;
        }
        .tab.active {
            background: #f8f9fa;
            border-bottom: 1px solid #f8f9fa;
            font-weight: bold;
        }
        .tab.sleeping {
            opacity: 0.6;
            font-style: italic;
        }
        .tab-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }
        .close-tab-btn {
            margin-left: 5px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 10px;
            padding: 0 4px;
        }
        .close-tab-btn:hover { color: #f00; }

        #new-tab-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0 8px;
            color: #333;
        }

        /* TOOLBAR AREA */
        #toolbar {
            display: flex;
            padding: 6px;
            background: #f8f9fa;
            border-bottom: 1px solid #caced1;
            align-items: center;
            height: 28px;
        }

        .btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 4px 6px;
            cursor: pointer;
            margin-right: 2px;
            font-size: 13px;
            color: #333;
        }

        .btn:hover { background: #e2e6ea; border: 1px solid #dae0e5; }

        #url-input {
            flex-grow: 1;
            padding: 5px 8px;
            margin: 0 5px;
            border: 1px solid #ced4da;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
        }

        #url-input:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.1rem rgba(0,123,255,.25);
        }

        #search-engine {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            font-size: 12px;
            margin-right: 4px;
            outline: none;
            cursor: pointer;
        }

        /* BOOKMARKS AREA */
        #bookmarks-bar {
            display: flex;
            background: #f1f3f4;
            padding: 2px 6px;
            border-bottom: 1px solid #ddd;
            height: 22px;
            align-items: center;
            overflow-x: auto;
        }

        .bookmark-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            margin-right: 2px;
            border-radius: 10px;
            color: #444;
        }
        .bookmark-btn:hover {
            background: #e0e0e0;
        }

        /* PROGRESS BAR */
        #progress-bar-container {
            width: 100%;
            height: 2px;
            background: transparent;
            position: absolute;
            top: 67px;
            z-index: 9999;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #007bff;
            transition: width 0.3s ease;
            display: none;
        }

        #webview-container { flex-grow: 1; position: relative; background: #fff; }
    </style>
</head>
<body>
    <div id="tabs-bar">
        <div id="tabs-container" style="display:flex;"></div>
        <button id="new-tab-btn" title="Nowa karta (Ctrl+T)">+</button>
    </div>

    <div id="toolbar">
        <button class="btn" id="back-btn" title="Back">⮜</button>
        <button class="btn" id="forward-btn" title="Forward">⮞</button>
        <button class="btn" id="refresh-btn" title="Refresh">⟳</button>

        <input type="text" id="url-input" placeholder="Wpisz adres (np. google.com) lub wyszukaj...">

        <button class="btn" id="add-bookmark-btn" title="Dodaj zakładkę">⭐</button>
        <button class="btn" id="reader-mode-btn" title="Tryb czytnika (Uprość tekst)">📖</button>
        <button class="btn" id="dark-mode-btn" title="Wymuś tryb ciemny">🌙</button>
        <button class="btn" id="sleep-tabs-btn" title="Uśpij karty (Zwolnij RAM)">💤</button>

        <select id="search-engine" title="Wybierz wyszukiwarkę">
            <option value="google">Google</option>
            <option value="duckduckgo">DuckDuckGo</option>
        </select>

        <button class="btn" id="go-btn" title="Go">Go</button>
    </div>

    <div id="bookmarks-bar"></div>

    <div id="progress-bar-container"><div id="progress-bar"></div></div>

    <div id="webview-container"></div>
    <script type="module" src="/main.js"></script>
</body>
</html>
