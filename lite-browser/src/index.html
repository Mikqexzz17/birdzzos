<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Browser</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e0e0e0; }

        #toolbar {
            display: flex;
            padding: 6px;
            background: #f8f9fa;
            border-bottom: 1px solid #caced1;
            align-items: center;
            height: 28px;
        }

        .btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            margin-right: 2px;
            font-size: 13px;
            color: #333;
        }

        .btn:hover { background: #e2e6ea; border: 1px solid #dae0e5; }

        #url-input {
            flex-grow: 1;
            padding: 5px 8px;
            margin: 0 5px;
            border: 1px solid #ced4da;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
        }

        #url-input:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.1rem rgba(0,123,255,.25);
        }

        #search-engine {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            font-size: 12px;
            margin-right: 4px;
            outline: none;
            cursor: pointer;
        }

        #progress-bar-container {
            width: 100%;
            height: 2px;
            background: transparent;
            position: absolute;
            top: 41px; /* Just below toolbar */
            z-index: 9999;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #007bff;
            transition: width 0.3s ease;
            display: none;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="btn" id="back-btn" title="Back">⮜</button>
        <button class="btn" id="forward-btn" title="Forward">⮞</button>
        <button class="btn" id="refresh-btn" title="Refresh">⟳</button>

        <input type="text" id="url-input" placeholder="Wpisz adres (np. google.com) lub wyszukaj...">

        <select id="search-engine" title="Wybierz wyszukiwarkę">
            <option value="google">Google</option>
            <option value="duckduckgo">DuckDuckGo</option>
        </select>

        <button class="btn" id="go-btn" title="Go">Go</button>
    </div>
    <div id="progress-bar-container"><div id="progress-bar"></div></div>
    <script type="module" src="/main.js"></script>
</body>
</html>
